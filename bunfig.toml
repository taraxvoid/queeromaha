[install]
minimumReleaseAge = 259200 # 3 days

# Packages that bypass the gate
minimumReleaseAgeExcludes = ["@taraxvoid/voidflow", "@types/bun", "bun-types","astro", "@astrojs/sitemap", "@astrojs/check", "@astrojs/react", "posthog-js", "@posthog/core", "@posthog/types"]

[install.security]
scanner = "@socketsecurity/bun-security-scanner"
