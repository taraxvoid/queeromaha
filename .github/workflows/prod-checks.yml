name: Prod Checks

# Full production gate — runs on PRs targeting live before merge
# Includes all e2e projects, a11y, and lighthouse
on:
  pull_request:
    branches: [live]
  workflow_dispatch:

concurrency:
  group: prod-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prod-checks:
    if: "!github.event.pull_request.draft"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache npm package dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - run: bun install --frozen-lockfile

      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e:all
      - run: bun run test:a11y
      - run: bun run test:e2e:lighthouse

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prod-check-reports
          path: |
            playwright-report/
            test-results/
