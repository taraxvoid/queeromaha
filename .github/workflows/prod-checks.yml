name: Prod Checks

# Full production gate — runs on PRs targeting live before merge
# Includes all e2e projects, a11y, and lighthouse
on:
  pull_request:
    branches: [live]
  workflow_dispatch:

concurrency:
  group: prod-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prod-checks:
    if: "!github.event.pull_request.draft"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - run: bun install --frozen-lockfile
  
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e:all
      - run: bun run test:a11y
      - run: bun run test:e2e:lighthouse

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: prod-check-reports
          path: |
            playwright-report/
            test-results/
