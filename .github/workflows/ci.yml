name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: taraxvoid/voidflow/.github/workflows/site-ci.yml@923a1cb8e4d276d14b16935452765304e07a4985 # v0.10.0
    with:
      single-environment: true
