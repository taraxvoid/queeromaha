name: Check Links

# Dead-link checker — runs scripts/check-links.ts against the built dist/
# HTML and markdown. Weekly all-links scan (cron) + manual dispatch.
on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday 9am UTC — full scan to catch stale/dead links
  workflow_dispatch:

concurrency:
  group: check-links-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Check links
        run: bun run check:links
