name: Ensure PR mergable
on:
  pull_request:
    branches: [main, next]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-checks:
    if: "!github.event.pull_request.draft"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - run: bun install --frozen-lockfile
      - run: bun run lint:actions
      - run: bun run audit
      - run: bun run lint
      - run: bun run check
      - run: bun run test:unit

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Fast e2e (mobile-chrome)
        if: github.event.pull_request.base.ref == 'main'
        run: bun run test:e2e:isolated

      - name: Broader e2e (all projects + a11y)
        if: github.event.pull_request.base.ref == 'next'
        run: |
          bun run test:e2e:all
          bun run test:a11y

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pr-check-reports
          path: |
            playwright-report/
            test-results/
