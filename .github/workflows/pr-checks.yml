name: Ensure PR mergable
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-checks:
    if: "!github.event.pull_request.draft"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # Playwright browser binaries (Chromium). Cache hit => no ~2min download.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-playwright-

      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # Validate workflow files before running expensive checks.
      - run: bun run lint:actions
      # Advisory only: reports high/critical vulns without blocking the gate.
      # Currently flags tmp(high) + uuid(moderate) via @lhci/cli. Set
      # continue-on-error: false once transitive deps are clean.
      - name: Audit dependencies
        run: bun audit --audit-level high
        continue-on-error: true
      - run: bun run lint
      - run: bun run test:unit
      - run: bun run check            # astro check (type-check)
      - run: bun run test:a11y

      - name: Upload a11y failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            playwright-report/
            test-results/
