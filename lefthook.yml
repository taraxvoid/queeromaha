# Shared hooks live in voidflow (pre-commit, commit-msg hint, pre-push).
# Pin to a release tag; Renovate bumps it. Site-specific overrides below.
remotes:
  - git_url: https://github.com/taraxvoid/voidflow
    ref: v0.10.0
    configs:
      - lefthook/site.yml

pre-commit:
  commands:
    unit:
      # test/build.test.ts and test/structured-data.test.ts assert against
      # dist/, which isn't guaranteed to exist pre-commit; test:push and CI
      # build first and run them there.
      run: bun run test:unit -- --exclude 'test/build.test.ts' --exclude 'test/structured-data.test.ts'
