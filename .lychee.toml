# .lychee.toml — shared config for .github/workflows/check-links.yml
# Loaded via `lychee --config .lychee.toml` (and auto-discovered from the workspace).

cache = true                 # write/read ./lycheecache (persisted via actions/cache)
max_cache_age = "1d"         # only re-check a URL at most once per day
max_retries = 2              # retry flaky networks (venue sites can 503 intermittently)
timeout = 15                 # seconds per URL
max_concurrency = 16         # parallelize the ~250 external links

# Mirror scripts/check-links.js policy: only 404/410 are "dead".
# 4xx bot-filter codes (401/403/405) and transient 5xx/429 are treated as OK,
# NOT as failures. (403 is accepted globally; rely on .lycheeignore for
# hosts that legitimately never respond to automation.)
accept = ["200..=299", "401", "403", "405", "429", "500", "502", "503", "504"]
